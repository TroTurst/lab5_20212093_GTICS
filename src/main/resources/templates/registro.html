<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Jardín de la Esperanza - Registro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:insert="~{base_layout :: layout_fragment (titulo='Registro de Usuario', contenido=~{::div.page-content})}">
    <div class="page-content container">
        <h1 class="mb-4">Registro de Usuario</h1>
        <form method="post" th:action="@{/registro/guardar}" th:object="${usuario}" class="row g-3">

            <div class="col-md-6">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombre" th:field="*{nombre}">
                <div class="text-danger" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}">Error Nombre</div>
            </div>

            <div class="col-md-6">
                <label for="apellido" class="form-label">Apellido</label>
                <input type="text" class="form-control" id="apellido" th:field="*{apellido}">
                <div class="text-danger" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}">Error Apellido</div>
            </div>

            <div class="col-md-6">
                <label for="correo" class="form-label">Correo Electrónico</label>
                <input type="text" class="form-control" id="correo" th:field="*{correo}">
                <div class="text-danger" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}">Error Correo</div>
            </div>

            <div class="col-md-6">
                <label for="edad" class="form-label">Edad</label>
                <input type="number" class="form-control" id="edad" th:field="*{edad}">
                <div class="text-danger" th:if="${#fields.hasErrors('edad')}" th:errors="*{edad}">Error Edad</div>
            </div>

            <div class="col-md-6">
                <label for="contrasena" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="contrasena" th:field="*{contrasena}">
                <div class="text-danger" th:if="${#fields.hasErrors('contrasena')}" th:errors="*{contrasena}">Error Contraseña</div>
            </div>

            <div class="col-12">
                <label for="descripcion" class="form-label">Descripción</label>
                <textarea class="form-control" id="descripcion" th:field="*{descripcion}" rows="3"></textarea>
                <div class="text-danger" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}">Error Descripción</div>
            </div>

            <div class="col-12 mt-4">
                <button type="submit" class="btn btn-primary">Registrarme</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
