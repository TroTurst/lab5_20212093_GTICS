<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Jardín de la Esperanza - Ranking</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:insert="~{base_layout :: layout_fragment (titulo='Ranking de Regalos', contenido=~{::div.page-content})}">
    <div class="page-content container">
        <h1 class="mb-4">Ranking de Usuarios por Regalos Recibidos</h1>

        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th scope="col">#</th>
                <th scope="col">Nombre del Usuario</th>
                <th scope="col">Total de Regalos Recibidos</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="rank : ${ranking}" th:with="usuarioNombre=${rank[1]}, totalRegalos=${rank[2]}">
                <th scope="row" th:text="${ranking.indexOf(rank) + 1}">1</th>
                <td th:text="${usuarioNombre}">Usuario Nombre</td>
                <td th:text="${totalRegalos}" class="fw-bold">10</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
