<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Jardín de la Esperanza - Enviar Mensaje</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:insert="~{base_layout :: layout_fragment (titulo='Enviar Mensaje y Regalo', contenido=~{::div.page-content})}">
    <div class="page-content container">
        <h1 class="mb-4">Enviar Mensaje y Regalo</h1>

        <form method="post" th:action="@{/enviar/guardar}" th:object="${mensaje}" class="row g-3">

            <input type="hidden" th:field="*{remitente.id}">

            <div class="col-md-6">
                <label for="destinatarioId" class="form-label">Destinatario</label>
                <select id="destinatarioId" class="form-select" th:field="*{destinatario.id}">
                    <option th:each="user : ${listaDestinatarios}"
                            th:value="${user.id}"
                            th:text="${user.nombre + ' ' + user.apellido}"></option>
                </select>
                <div class="text-danger" th:if="${#fields.hasErrors('destinatario.id')}" th:errors="*{destinatario.id}">Error Destinatario</div>
            </div>

            <div class="col-md-6">
                <label class="form-label">Tipo de Regalo</label>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="regaloTipo" id="flor" value="Flor" checked th:field="*{regaloTipo}" onclick="document.getElementById('regaloColor').value='Amarillo'; document.getElementById('regaloColor').disabled=true;">
                    <label class="form-check-label" for="flor">Flor Amarilla (Apoyo/Ánimo) - Color único: Amarillo</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="regaloTipo" id="carrito" value="Carrito" th:field="*{regaloTipo}" onclick="document.getElementById('regaloColor').disabled=false;">
                    <label class="form-check-label" for="carrito">Carrito (Amistad/Deseos)</label>
                </div>
            </div>

            <div class="col-md-6">
                <label for="regaloColor" class="form-label">Color del Regalo</label>
                <input type="text" class="form-control" id="regaloColor" th:field="*{regaloColor}" value="Amarillo" disabled>
                <div class="form-text text-muted">Selecciona "Carrito" para elegir un color.</div>
            </div>

            <div class="col-12">
                <label for="contenido" class="form-label">Mensaje Motivacional</label>
                <textarea class="form-control" id="contenido" th:field="*{contenido}" rows="4"></textarea>
                <div class="text-danger" th:if="${#fields.hasErrors('contenido')}" th:errors="*{contenido}">Error Contenido</div>
            </div>

            <div class="col-12 mt-4">
                <button type="submit" class="btn btn-success">Enviar Mensaje</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
