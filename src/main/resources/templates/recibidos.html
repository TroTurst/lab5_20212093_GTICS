<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Jardín de la Esperanza - Mensajes Recibidos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:insert="~{base_layout :: layout_fragment (titulo='Mensajes Recibidos', contenido=~{::div.page-content})}">
    <div class="page-content container">
        <h1 class="mb-4">Bandeja de Mensajes Recibidos</h1>

        <div th:if="${usuario}" class="alert alert-info">
            <h5 th:text="'Hola ' + ${usuario.nombre} + ', tienes ' + ${totalMensajes} + ' regalos y mensajes.'"></h5>
        </div>
        <div th:if="${totalMensajes == 0}" class="alert alert-warning">
            Aún no has recibido ningún regalo.
        </div>

        <div class="list-group">
            <div class="list-group-item list-group-item-action flex-column align-items-start" th:each="mensaje : ${mensajes}">
                <div class="d-flex w-100 justify-content-between">
                    <h5 class="mb-1 text-primary">De: <span th:text="${mensaje.remitente.nombre + ' ' + mensaje.remitente.apellido}">Remitente</span></h5>
                    <small th:text="${#dates.format(mensaje.fechaEnvio, 'dd/MM/yyyy HH:mm')}">Fecha</small>
                </div>
                <p class="mb-1">
                    **Regalo:**
                    <span th:text="${mensaje.regaloTipo}"></span>
                    <span th:if="${mensaje.regaloTipo == 'Carrito'}" th:text="' - Color: ' + ${mensaje.regaloColor}" class="badge bg-secondary"></span>
                    <span th:if="${mensaje.regaloTipo == 'Flor'}" th:text="' - Color: ' + ${mensaje.regaloColor}" class="badge bg-warning"></span>
                </p>
                <p class="mb-1 fst-italic">
                    <q th:text="${mensaje.contenido}">Contenido del mensaje motivacional.</q>
                </p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
