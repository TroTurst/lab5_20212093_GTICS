<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Jardín de la Esperanza - Home</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .page-content { padding: 30px 0; }
    .card-title { color: #ffc107; font-weight: 700; }
    .btn-warning {
      background-color: #ffc107; border-color: #ffc107; color: #343a40; transition: background-color 0.3s;
    }
    .btn-warning:hover { background-color: #e0a800; border-color: #e0a800; }
  </style>
</head>
<body>

<div th:insert="~{base_layout :: layout_fragment (titulo='Lista de Usuarios', contenido=~{::div.page-content})}">

  <div class="page-content">
    <h1 class="mb-5 text-center text-dark fw-light">Usuarios Registrados en la Campaña</h1>

    <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4">

      <div class="col" th:each="user : ${listaUsuarios}">
        <div class="card h-100 shadow-sm border-0">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title mb-1" th:text="${user.nombre + ' ' + user.apellido}">Nombre Apellido</h5>
            <h6 class="card-subtitle mb-2 text-muted" th:text="${user.correo}">correo@mail.com</h6>

            <p class="card-text mt-3 flex-grow-1">
              <small class="d-block text-secondary fw-bold mb-1">Descripción:</small>
              <span th:text="${user.descripcion}">Apasionado por el fútbol.</span>
            </p>

            <div class="mt-auto pt-3 border-top">
              <a th:href="@{/enviar(destinatarioId=${user.id})}" class="btn btn-sm btn-warning w-100">
                Enviar Flor/Carrito
              </a>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

</div>
</body>
</html>
